<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rekap Absensi - Absensi Digital</title>

   <style>

    /* =========================
   STATISTIK REKAP
========================= */

.rekap-statistik {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat-card {
    background: #f8f9fa;
    border: 1px solid #e1e1e1;
    border-radius: 10px;
    padding: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.stat-card > span {
    font-size: 24px;
}

.stat-card p {
    font-size: 12px;
    color: #666;
    margin-bottom: 4px;
}

.stat-card strong {
    font-size: 22px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 900px) {

    .rekap-statistik {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 500px) {

    .rekap-statistik {
        grid-template-columns: 1fr;
    }

}

    .export-pdf-button {
    border: none;
    background: #dc3545;
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

.export-pdf-button:hover {
    opacity: 0.9;
}
    .export-button {
    border: none;
    background: #198754;
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

.export-button:hover {
    opacity: 0.9;
}

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        color: #333;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
        background: white;
        padding: 18px 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .header h1 {
        font-size: 22px;
    }

    .back-button {
        border: none;
        background: #6c757d;
        color: white;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
    }

    .back-button:hover {
        opacity: 0.9;
    }


    /* =========================
       CONTAINER
    ========================= */

    .container {
        max-width: 1250px;
        margin: 30px auto;
        padding: 0 20px;
    }


    /* =========================
       CARD
    ========================= */

    .card {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .card h2 {
        margin-bottom: 20px;
        font-size: 20px;
    }


    /* =========================
       FILTER
    ========================= */

    .filter {
        display: grid;
        grid-template-columns: 1fr 1fr 180px auto;
        gap: 12px;
        margin-bottom: 20px;
    }

    .filter input,
    .filter select {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 14px;
        background: white;
    }

    .filter input:focus,
    .filter select:focus {
        outline: none;
        border-color: #6c757d;
    }


    /* =========================
       TABLE
    ========================= */

    .table-container {
        width: 100%;
        overflow-x: auto;
        border: 1px solid #ddd;
        border-radius: 8px;
    }

    table {
        width: 100%;
        min-width: 950px;
        border-collapse: collapse;
    }

    th,
    td {
        padding: 12px 10px;
        border-bottom: 1px solid #ddd;
        text-align: center;
        white-space: nowrap;
    }

    th {
        background: #f1f3f5;
        font-size: 14px;
    }

    td {
        font-size: 14px;
    }

    tbody tr:hover {
        background: #f8f9fa;
    }


    /* =========================
       STATUS
    ========================= */

    td:last-child {
        font-weight: bold;
    }


    /* =========================
       DATA KOSONG
    ========================= */

    .empty {
        text-align: center;
        color: #777;
        padding: 25px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

        .header {
            padding: 15px;
        }

        .header h1 {
            font-size: 18px;
        }

        .back-button {
            padding: 9px 12px;
            font-size: 13px;
        }

        .container {
            margin: 20px auto;
            padding: 0 12px;
        }

        .card {
            padding: 15px;
        }

        .card h2 {
            font-size: 18px;
        }

        .filter {
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .filter input,
        .filter select {
            padding: 12px;
        }

        table {
            min-width: 950px;
        }

    }

</style>

</head>


<body>

    <header class="header">

        <h1>
            📋 Rekap Absensi
        </h1>

        <button
            class="back-button"
            id="backButton"
        >
            ← Dashboard
        </button>

    </header>


    <main class="container">

        <section class="card">

            <h2>
                Data Absensi Peserta
            </h2>
            <!-- STATISTIK REKAP -->

<div class="rekap-statistik">

    <div class="stat-card">
        <span>👥</span>
        <div>
            <p>Total Absensi</p>
            <strong id="jumlahAbsensi">0</strong>
        </div>
    </div>

    <div class="stat-card">
        <span>🟢</span>
        <div>
            <p>Hadir</p>
            <strong id="jumlahHadir">0</strong>
        </div>
    </div>

    <div class="stat-card">
        <span>🕘</span>
        <div>
            <p>Sudah Masuk</p>
            <strong id="jumlahMasuk">0</strong>
        </div>
    </div>

    <div class="stat-card">
        <span>🔴</span>
        <div>
            <p>Sudah Pulang</p>
            <strong id="jumlahPulang">0</strong>
        </div>
    </div>

    <div class="stat-card">
        <span>⏳</span>
        <div>
            <p>Belum Pulang</p>
            <strong id="jumlahBelumPulang">0</strong>
        </div>
    </div>

</div>


            <!-- FILTER -->

            <div class="filter">

                <input
                    type="date"
                    id="filterTanggal"
                >

                <input
                    type="text"
                    id="filterNama"
                    placeholder="Cari nama..."
                >

                <select id="filterKelas">

                    <option value="">
                        Semua Kelas
                    </option>

                    <option value="7">
                        Kelas 7
                    </option>

                    <option value="8">
                        Kelas 8
                    </option>

                    <option value="9">
                        Kelas 9
                    </option>

                </select>
                <button
    id="exportExcel"
    class="export-button"
>
    📊 Export Excel
</button>

<button
    id="exportPDF"
    class="export-pdf-button"
>
    📄 Export PDF
</button>

            </div>


            <!-- TABLE -->

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>No</th>

                            <th>Nama</th>

                            <th>NIS</th>

                            <th>Kelas</th>

                            <th>Tanggal</th>

                            <th>Jam Masuk</th>

                            <th>Jam Pulang</th>

                            <th>Status</th>

                        </tr>

                    </thead>


                    <tbody id="absensiTable">

                        <tr>

                            <td
                                colspan="8"
                                class="empty"
                            >
                                Memuat data...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- FIREBASE -->
     <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

     <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <script type="module">

        import {
            auth,
            db
        } from "./firebase.js";


        import {
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


        import {
            collection,
            getDocs
        } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


        // ====================================
        // CEK LOGIN
        // ====================================

        onAuthStateChanged(auth, async (user) => {

            if (!user) {

                window.location.href = "index.html";

                return;

            }


            try {

                const snapshot =
                    await getDocs(
                        collection(db, "users")
                    );


                let isAdmin = false;


                snapshot.forEach((item) => {

                    const data =
                        item.data();


                    if (
                        data.uid === user.uid &&
                        data.role === "admin"
                    ) {

                        isAdmin = true;

                    }

                });


                if (!isAdmin) {

                    alert(
                        "Halaman ini hanya dapat diakses Admin."
                    );

                    window.location.href =
                        "index.html";

                    return;

                }


                loadAbsensi();

            } catch (error) {

                console.error(error);

                alert(
                    "Gagal memeriksa akses Admin."
                );

            }

        });


        // ====================================
        // LOAD DATA ABSENSI
        // ====================================

        let semuaData = [];


        async function loadAbsensi() {

            const table =
                document.getElementById(
                    "absensiTable"
                );


            try {

                const snapshot =
                    await getDocs(
                        collection(
                            db,
                            "absensi"
                        )
                    );


                semuaData = [];


                snapshot.forEach((item) => {

                    semuaData.push(
                        item.data()
                    );

                });


                tampilkanData();

            } catch (error) {

                console.error(error);

                table.innerHTML = `

                    <tr>

                        <td
                            colspan="8"
                            class="empty"
                        >
                            Gagal mengambil data absensi.

                        </td>

                    </tr>

                `;

            }

        }


        // ====================================
        // TAMPILKAN DATA
        // ====================================

        function tampilkanData() {

            const table =
                document.getElementById(
                    "absensiTable"
                );


            const tanggal =
                document.getElementById(
                    "filterTanggal"
                ).value;


            const nama =
                document.getElementById(
                    "filterNama"
                ).value
                .toLowerCase();


            const kelas =
                document.getElementById(
                    "filterKelas"
                ).value;


            const hasil =
                semuaData.filter((data) => {

                    const cocokTanggal =
                        !tanggal ||
                        data.tanggal === tanggal;


                    const cocokNama =
                        !nama ||
                        (data.nama || "")
                            .toLowerCase()
                            .includes(nama);


                    const cocokKelas =
                        !kelas ||
                        data.kelas === kelas;


                    return (
                        cocokTanggal &&
                        cocokNama &&
                        cocokKelas
                    );

                });

                // ====================================
// HITUNG STATISTIK
// ====================================

let jumlahHadir = 0;
let jumlahMasuk = 0;
let jumlahPulang = 0;
let jumlahBelumPulang = 0;


hasil.forEach((data) => {

    // Total hadir
    if (
        data.status === "Hadir"
    ) {

        jumlahHadir++;

    }


    // Sudah absen masuk
    if (
        data.jamMasuk &&
        data.jamMasuk !== "-"
    ) {

        jumlahMasuk++;

    }


    // Sudah absen pulang
    if (
        data.jamPulang &&
        data.jamPulang !== "-" &&
        data.jamPulang !== "Belum absen"
    ) {

        jumlahPulang++;

    } else {

        jumlahBelumPulang++;

    }

});


// Tampilkan statistik

document.getElementById(
    "jumlahAbsensi"
).textContent = hasil.length;


document.getElementById(
    "jumlahHadir"
).textContent = jumlahHadir;


document.getElementById(
    "jumlahMasuk"
).textContent = jumlahMasuk;


document.getElementById(
    "jumlahPulang"
).textContent = jumlahPulang;


document.getElementById(
    "jumlahBelumPulang"
).textContent = jumlahBelumPulang;


            table.innerHTML = "";


            if (hasil.length === 0) {

                table.innerHTML = `

                    <tr>

                        <td
                            colspan="8"
                            class="empty"
                        >
                            Tidak ada data absensi.

                        </td>

                    </tr>

                `;

                return;

            }


            hasil.forEach((data, index) => {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>${index + 1}</td>

                    <td>${data.nama || "-"}</td>

                    <td>${data.nis || "-"}</td>

                    <td>${data.kelas || "-"}</td>

                    <td>${data.tanggal || "-"}</td>

                    <td>${data.jamMasuk || "-"}</td>

                    <td>${data.jamPulang || "-"}</td>

                    <td>${data.status || "-"}</td>

                `;


                table.appendChild(row);

            });

        }


        // ====================================
        // FILTER
        // ====================================

        document.getElementById(
            "filterTanggal"
        ).addEventListener(
            "change",
            tampilkanData
        );


        document.getElementById(
            "filterNama"
        ).addEventListener(
            "input",
            tampilkanData
        );


        document.getElementById(
            "filterKelas"
        ).addEventListener(
            "change",
            tampilkanData
        );


        // ====================================
        // KEMBALI
        // ====================================

        document.getElementById(
            "backButton"
        ).addEventListener(
            "click",
            () => {

                window.location.href =
                    "admin.html";

            }
        );
// ====================================
// EXPORT EXCEL
// ====================================

document.getElementById(
    "exportExcel"
).addEventListener(
    "click",
    () => {

        const tanggal =
            document.getElementById(
                "filterTanggal"
            ).value;

        const nama =
            document.getElementById(
                "filterNama"
            ).value
            .toLowerCase();

        const kelas =
            document.getElementById(
                "filterKelas"
            ).value;


        // Ambil data sesuai filter

        const hasil =
            semuaData.filter((data) => {

                const cocokTanggal =
                    !tanggal ||
                    data.tanggal === tanggal;


                const cocokNama =
                    !nama ||
                    (data.nama || "")
                        .toLowerCase()
                        .includes(nama);


                const cocokKelas =
                    !kelas ||
                    data.kelas === kelas;


                return (
                    cocokTanggal &&
                    cocokNama &&
                    cocokKelas
                );

            });


        if (hasil.length === 0) {

            alert(
                "Tidak ada data untuk diexport."
            );

            return;

        }


        // Buat data Excel

        const dataExcel =
            hasil.map((data, index) => ({

                "No":
                    index + 1,

                "Nama":
                    data.nama || "-",

                "NIS":
                    data.nis || "-",

                "Kelas":
                    data.kelas || "-",

                "Tanggal":
                    data.tanggal || "-",

                "Jam Masuk":
                    data.jamMasuk || "-",

                "Jam Pulang":
                    data.jamPulang || "-",

                "Jarak Masuk (m)":
                    data.jarakMeter ?? "-",

                "Akurasi GPS Masuk (m)":
                    data.akurasiGPS ?? "-",

                "Jarak Pulang (m)":
                    data.jarakPulangMeter ?? "-",

                "Akurasi GPS Pulang (m)":
                    data.akurasiPulangGPS ?? "-",

                "Status":
                    data.status || "-"

            }));


        // Buat worksheet

        const worksheet =
            XLSX.utils.json_to_sheet(
                dataExcel
            );


        // Buat workbook

        const workbook =
            XLSX.utils.book_new();


        XLSX.utils.book_append_sheet(
            workbook,
            worksheet,
            "Rekap Absensi"
        );


        // Nama file

        let namaFile =
            "Rekap_Absensi";


        if (tanggal) {

            namaFile +=
                "_" + tanggal;

        }


        namaFile += ".xlsx";


        // Download Excel

        XLSX.writeFile(
            workbook,
            namaFile
        );

    }
);

// ====================================
// EXPORT PDF
// ====================================

document.getElementById(
    "exportPDF"
).addEventListener(
    "click",
    () => {

        const tanggal =
            document.getElementById(
                "filterTanggal"
            ).value;

        const nama =
            document.getElementById(
                "filterNama"
            ).value
            .toLowerCase();

        const kelas =
            document.getElementById(
                "filterKelas"
            ).value;


        // Ambil data sesuai filter

        const hasil =
            semuaData.filter((data) => {

                const cocokTanggal =
                    !tanggal ||
                    data.tanggal === tanggal;


                const cocokNama =
                    !nama ||
                    (data.nama || "")
                        .toLowerCase()
                        .includes(nama);


                const cocokKelas =
                    !kelas ||
                    data.kelas === kelas;


                return (
                    cocokTanggal &&
                    cocokNama &&
                    cocokKelas
                );

            });


        if (hasil.length === 0) {

            alert(
                "Tidak ada data untuk diexport."
            );

            return;

        }


        // ====================================
        // BUAT PDF
        // ====================================

        const {
            jsPDF
        } = window.jspdf;


        const pdf =
            new jsPDF({
                orientation: "landscape",
                unit: "mm",
                format: "a4"
            });


        // ====================================
        // JUDUL
        // ====================================

        pdf.setFontSize(16);

        pdf.text(
            "REKAP ABSENSI DIGITAL SEKOLAH",
            148,
            15,
            {
                align: "center"
            }
        );


        pdf.setFontSize(10);

        let keterangan =
            "Semua Data";


        if (tanggal) {

            keterangan =
                "Tanggal: " + tanggal;

        }


        if (kelas) {

            keterangan +=
                " | Kelas: " + kelas;

        }


        if (nama) {

            keterangan +=
                " | Nama: " + nama;

        }


        pdf.text(
            keterangan,
            148,
            22,
            {
                align: "center"
            }
        );


        // ====================================
        // DATA TABEL
        // ====================================

        const rows =
            hasil.map(
                (data, index) => [

                    index + 1,

                    data.nama || "-",

                    data.nis || "-",

                    data.kelas || "-",

                    data.tanggal || "-",

                    data.jamMasuk || "-",

                    data.jamPulang || "-",

                    data.status || "-"

                ]
            );


        pdf.autoTable({

            startY: 28,

            head: [[

                "No",
                "Nama",
                "NIS",
                "Kelas",
                "Tanggal",
                "Jam Masuk",
                "Jam Pulang",
                "Status"

            ]],

            body: rows,

            theme: "grid",

            styles: {

                fontSize: 8,

                cellPadding: 3

            },

            headStyles: {

                fontSize: 8

            }

        });


        // ====================================
        // SIMPAN PDF
        // ====================================

        let namaFile =
            "Rekap_Absensi";


        if (tanggal) {

            namaFile +=
                "_" + tanggal;

        }


        if (kelas) {

            namaFile +=
                "_Kelas_" + kelas;

        }


        namaFile += ".pdf";


        pdf.save(
            namaFile
        );

    }
);
    </script>

</body>

</html>
