<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard Admin - Absensi Digital</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background: #ffffff;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .header h1 {
            font-size: 22px;
            color: #222;
        }

        .logout-button {
            border: none;
            background: #dc3545;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-button:hover {
            opacity: 0.9;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }


        /* =========================
           WELCOME
        ========================= */

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .welcome h2 {
            margin-bottom: 8px;
        }

        .welcome p {
            color: #666;
        }


        /* =========================
           CARD
        ========================= */

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .card h3 {
            font-size: 16px;
            color: #666;
            margin-bottom: 10px;
        }

        .card .number {
            font-size: 32px;
            font-weight: bold;
        }


        /* =========================
           MENU
        ========================= */

        .menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .menu-button {
            background: white;
            border: none;
            padding: 25px;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: 0.2s;
        }

        .menu-button:hover {
            transform: translateY(-2px);
        }

        .menu-button h3 {
            margin-bottom: 8px;
        }

        .menu-button p {
            color: #666;
            font-size: 14px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .header {
                padding: 15px;
            }

            .header h1 {
                font-size: 18px;
            }

            .logout-button {
                padding: 8px 12px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .menu {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <h1>
            Absensi Digital Sekolah
        </h1>

        <button
            id="logoutButton"
            class="logout-button"
        >
            Logout
        </button>

    </header>


    <!-- =========================
         CONTENT
    ========================= -->

    <main class="container">


        <!-- WELCOME -->

        <section class="welcome">

            <h2 id="welcomeText">
                Dashboard Admin
            </h2>

            <p>
                Selamat datang di halaman administrasi
                Absensi Digital Sekolah.
            </p>

        </section>


        <!-- =========================
             STATISTIK
        ========================= -->

        <section class="cards">

            <div class="card">

                <h3>
                    Total Peserta
                </h3>

                <div
                    class="number"
                    id="totalUsers"
                >
                    0
                </div>

            </div>


            <div class="card">

                <h3>
                    Absen Masuk Hari Ini
                </h3>

                <div
                    class="number"
                    id="totalMasuk"
                >
                    0
                </div>

            </div>


            <div class="card">

                <h3>
                    Absen Pulang Hari Ini
                </h3>

                <div
                    class="number"
                    id="totalPulang"
                >
                    0
                </div>

            </div>

        </section>


        <!-- =========================
             MENU ADMIN
        ========================= -->

        <section class="menu">

            <button
                class="menu-button"
                id="dataPesertaButton"
            >

                <h3>
                    👥 Data Peserta
                </h3>

                <p>
                    Melihat dan mengelola data pengguna
                    yang terdaftar.
                </p>

            </button>


            <button
                class="menu-button"
                id="rekapButton"
            >

                <h3>
                    📋 Rekap Absensi
                </h3>

                <p>
                    Melihat data kehadiran peserta.
                </p>

            </button>


            <button
                class="menu-button"
                id="exportButton"
            >

                <h3>
                    📊 Export Data
                </h3>

                <p>
                    Export data absensi ke Excel atau PDF.
                </p>

            </button>


            <button
                class="menu-button"
                id="pengaturanButton"
            >

                <h3>
                    ⚙️ Pengaturan
                </h3>

                <p>
                    Pengaturan sistem absensi.
                </p>

            </button>

        </section>


    </main>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script type="module">

        import {
            auth,
            db
        } from "./js/firebase.js";


        import {
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


        import {
            doc,
            getDoc,
            collection,
            getDocs
        } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


        // ====================================
        // CEK LOGIN
        // ====================================

        onAuthStateChanged(auth, async (user) => {

            // Jika belum login
            if (!user) {

                window.location.href = "index.html";

                return;
            }


            try {

                // Ambil data user dari Firestore
                const userRef = doc(
                    db,
                    "users",
                    user.uid
                );

                const userSnapshot =
                    await getDoc(userRef);


                // Jika data user tidak ada
                if (!userSnapshot.exists()) {

                    alert(
                        "Data pengguna tidak ditemukan."
                    );

                    await signOut(auth);

                    window.location.href =
                        "index.html";

                    return;
                }


                // Ambil data user
                const userData =
                    userSnapshot.data();


                // Cek role
                if (userData.role !== "admin") {

                    alert(
                        "Anda tidak memiliki akses Admin."
                    );

                    await signOut(auth);

                    window.location.href =
                        "index.html";

                    return;
                }


                // Tampilkan nama admin
                document.getElementById(
                    "welcomeText"
                ).textContent =
                    "Selamat datang, " +
                    (userData.nama || "Admin");


                // Ambil jumlah pengguna
                await loadTotalUsers();


            } catch (error) {

                console.error(
                    "Terjadi kesalahan:",
                    error
                );

                alert(
                    "Terjadi kesalahan saat memuat dashboard."
                );

            }

        });


        // ====================================
        // HITUNG TOTAL USER
        // ====================================

        async function loadTotalUsers() {

            try {

                const usersSnapshot =
                    await getDocs(
                        collection(db, "users")
                    );


                let jumlahUser = 0;


                usersSnapshot.forEach((doc) => {

                    const data = doc.data();


                    // Admin tidak dihitung sebagai peserta
                    if (data.role !== "admin") {

                        jumlahUser++;

                    }

                });


                document.getElementById(
                    "totalUsers"
                ).textContent = jumlahUser;


            } catch (error) {

                console.error(
                    "Gagal mengambil data user:",
                    error
                );

            }

        }


        // ====================================
        // LOGOUT
        // ====================================

        document.getElementById(
            "logoutButton"
        ).addEventListener(
            "click",
            async () => {

                try {

                    await signOut(auth);

                    window.location.href =
                        "index.html";

                } catch (error) {

                    console.error(
                        "Logout gagal:",
                        error
                    );

                    alert(
                        "Logout gagal."
                    );

                }

            }
        );


        // ====================================
        // MENU SEMENTARA
        // ====================================

        document.getElementById(
            "dataPesertaButton"
       ).addEventListener(
    "click",
    () => {

        window.location.href =
            "peserta.html";

            }
        );


        document.getElementById(
            "rekapButton"
        ).addEventListener(
            "click",
            () => {

                alert(
                    "Fitur Rekap Absensi akan kita buat setelah sistem absen selesai."
                );

            }
        );


        document.getElementById(
            "exportButton"
        ).addEventListener(
            "click",
            () => {

                alert(
                    "Fitur Export Excel/PDF akan kita buat setelah data absensi tersedia."
                );

            }
        );


        document.getElementById(
            "pengaturanButton"
        ).addEventListener(
            "click",
            () => {

                alert(
                    "Fitur Pengaturan akan kita buat nanti."
                );

            }
        );

    </script>


</body>

</html>
